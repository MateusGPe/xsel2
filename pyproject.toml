[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "scraperpy"
version = "0.6.0"
description = "High-performance HTML/XML scraping, multi-pattern text search, and JSON transformation engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MateusGPe" }]
keywords = ["scraping", "html", "xml", "css", "xpath", "json", "jmespath", "jsonpath", "aho-corasick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://mateusgpe.github.io/xsel2"
Documentation = "https://mateusgpe.github.io/xsel2"
Repository = "https://github.com/MateusGPe/xsel2"
Issues = "https://github.com/MateusGPe/xsel2/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["scraperpy"]
sdist.include = [
    "CMakeLists.txt",
    "cmake/CPM.cmake",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/**",
    "scraperpy/**",
    "scraperpy-stubs/**",
]
sdist.exclude = [
    "build*",
    "dist",
    "install",
    "xmlsel-main",
    ".git*",
    ".cache",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 pp*"
build-verbosity = 1
test-requires = ["pytest"]
test-command = "pytest {project}/tests/test_python.py -v"

[tool.cibuildwheel.config-settings]
"cmake.define.XSEL_FETCH_LIBXML2" = "ON"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
environment = { CPM_SOURCE_CACHE = "/tmp/cpm-cache" }

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { CPM_SOURCE_CACHE = "/tmp/cpm-cache" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { CPM_SOURCE_CACHE = "C:\\cpm-cache" }
