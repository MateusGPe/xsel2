name: Pack scraperpy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pack-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev python3-dev ninja-build

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build and verify scraperpy wheel & sdist
        run: |
          chmod +x scripts/pack_python.sh
          ./scripts/pack_python.sh --clean --test

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraperpy-dist
          path: dist/*
